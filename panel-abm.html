<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel ABM — Operaciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0f172a; --navy-700:#1e293b; --navy-800:#1e2d4a;
    --teal:#1dbf8e; --blue:#1a9fd4; --text:#f1f5f9; --text-muted:#94a3b8;
    --border:#334155; --red:#ef4444; --yellow:#f59e0b; --green:#10b981;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--navy);color:var(--text);line-height:1.5}
  .container{max-width:1400px;margin:0 auto;padding:20px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
  h1{font-size:22px;font-weight:700}
  h1 span{color:var(--text-muted);font-weight:400;font-size:14px;display:block;margin-top:2px}
  a.back{color:var(--text-muted);text-decoration:none;font-size:13px}
  a.back:hover{color:var(--text)}
  .card{background:var(--navy-800);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  .filtros{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .campo{display:flex;flex-direction:column;gap:5px;min-width:160px}
  .campo label{font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:700;letter-spacing:.03em}
  .campo input{background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit}
  .campo input:focus{outline:none;border-color:var(--teal)}
  .campo small{color:var(--text-muted);font-size:10px}
  button{background:var(--teal);color:var(--navy);border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;transition:opacity .15s}
  button:hover{opacity:.85}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .estado-box{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-muted);margin-top:10px}
  .estado-box.error{color:var(--red)}
  .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .resumen{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}
  .stat{display:flex;flex-direction:column}
  .stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;font-weight:700;letter-spacing:.03em}
  .stat-value{font-size:24px;font-weight:900;font-family:'JetBrains Mono',monospace;color:var(--teal)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input{background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;min-width:220px}
  table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  thead th{position:sticky;top:0;background:var(--navy-700);text-align:left;padding:8px 10px;color:var(--text-muted);text-transform:uppercase;font-size:10px;letter-spacing:.03em;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
  thead th:hover{color:var(--text)}
  tbody td{padding:7px 10px;border-top:1px solid var(--border)}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .tabla-wrap{overflow:auto;max-height:60vh;border:1px solid var(--border);border-radius:10px}
  .pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px;font-size:13px}
  .pager button{padding:6px 14px}
  .empty{text-align:center;padding:40px;color:var(--text-muted)}
  .num{font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Panel ABM — Operaciones<span>Reporte de transacciones (panel.alleata.co) sincronizado en vivo</span></h1>
    </div>
    <a class="back" href="index.html">← Volver al portal</a>
  </header>

  <div class="card">
    <div class="filtros">
      <div class="campo">
        <label>Desde *</label>
        <input type="date" id="f-desde">
      </div>
      <div class="campo">
        <label>Hasta *</label>
        <input type="date" id="f-hasta">
      </div>
      <div class="campo">
        <label>Contrato ID</label>
        <input type="text" id="f-contrato" placeholder="(todos)">
        <small>Opcional — dejar vacío trae todos los contratos disponibles</small>
      </div>
      <div class="campo">
        <label>Tienda ID</label>
        <input type="text" id="f-tienda" placeholder="(todas)">
        <small>Opcional — dejar vacío trae todas las tiendas</small>
      </div>
      <button id="btn-consultar" onclick="consultar()">🔍 Consultar</button>
    </div>
    <div class="estado-box" id="estado" style="display:none"></div>
  </div>

  <div class="card" id="resultados-card" style="display:none">
    <div class="resumen" id="resumen"></div>
    <div class="toolbar">
      <input type="text" id="buscar" placeholder="Buscar en los resultados..." oninput="renderTabla()">
      <button class="ghost" onclick="descargarExcel()">📊 Descargar Excel</button>
    </div>
    <div class="tabla-wrap">
      <table>
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script>
const RAILWAY_BASE = 'https://alleata-agent-production.up.railway.app';
const AUTOMATION_SECRET = '123456'; // mismo secret compartido que usa railwayFetch() en index.html

let _filas = [];       // dataset completo devuelto por el backend
let _columnas = [];    // nombres de columna (sale del primer registro)
let _pagina = 1;
const PAGE_SIZE = 50;
let _sortCol = null, _sortDir = 1;

// Requiere estar logueado en el portal principal (mismo patrón que
// napse-watchdog.html) — no reimplementa login acá, solo chequea que
// exista sesión.
function requiereSesion(){
  const token = localStorage.getItem('supabase_token');
  if(!token){
    alert('Necesitás estar logueado en el portal. Te llevo al login.');
    window.location.href = 'index.html';
    return null;
  }
  return token;
}

// Default: hoy en las dos fechas
(function initFechas(){
  const hoy = new Date().toISOString().slice(0,10);
  document.getElementById('f-desde').value = hoy;
  document.getElementById('f-hasta').value = hoy;
})();

function mostrarEstado(msg, tipo){
  const el = document.getElementById('estado');
  el.style.display = 'flex';
  el.className = 'estado-box' + (tipo==='error' ? ' error' : '');
  el.innerHTML = tipo==='loading'
    ? `<div class="spinner"></div><span>${msg}</span>`
    : `<span>${msg}</span>`;
}
function ocultarEstado(){
  document.getElementById('estado').style.display = 'none';
}

async function consultar(){
  if(!requiereSesion()) return;
  const desde = document.getElementById('f-desde').value;
  const hasta = document.getElementById('f-hasta').value;
  const contractId = document.getElementById('f-contrato').value.trim();
  const storeId = document.getElementById('f-tienda').value.trim();
  if(!desde || !hasta){ alert('Completá Desde y Hasta.'); return; }

  const btn = document.getElementById('btn-consultar');
  btn.disabled = true;
  document.getElementById('resultados-card').style.display = 'none';
  // El flujo real es: crear el reporte en el panel de Alleata → esperar a
  // que termine de generarse → bajarlo. Puede tardar unos segundos, así
  // que el mensaje de carga es explícito sobre eso (evita que parezca
  // colgado).
  mostrarEstado('Generando el reporte en el panel de Alleata (puede tardar unos segundos)...', 'loading');

  try{
    const r = await fetch(`${RAILWAY_BASE}/automations/operaciones-alleata/consultar`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-automation-secret': AUTOMATION_SECRET,
      },
      body: JSON.stringify({ desde, hasta, contractId, storeId }),
    });
    const j = await r.json();
    if(!r.ok || !j.ok) throw new Error(j.error || `Respuesta no OK (HTTP ${r.status})`);

    _filas = j.filas || [];
    _columnas = _filas.length ? Object.keys(_filas[0]) : [];
    _pagina = 1;
    _sortCol = null;
    document.getElementById('buscar').value = '';
    ocultarEstado();
    document.getElementById('resultados-card').style.display = 'block';
    renderResumen();
    renderTabla();
  }catch(e){
    mostrarEstado('⚠️ Error: ' + e.message, 'error');
  }finally{
    btn.disabled = false;
  }
}

function renderResumen(){
  const total = _filas.length;
  const colVenta = _columnas.find(c => /TOTAL DE VENTAS/i.test(c));
  const sumaVentas = colVenta ? _filas.reduce((a,f)=>a+(Number(f[colVenta])||0),0) : null;
  document.getElementById('resumen').innerHTML = `
    <div class="stat"><div class="stat-label">Registros</div><div class="stat-value">${total.toLocaleString('es-AR')}</div></div>
    ${sumaVentas!=null ? `<div class="stat"><div class="stat-label">Total de ventas</div><div class="stat-value">$${sumaVentas.toLocaleString('es-AR')}</div></div>` : ''}
  `;
}

function filasFiltradas(){
  const q = document.getElementById('buscar').value.trim().toLowerCase();
  let rows = !q ? _filas : _filas.filter(f =>
    _columnas.some(c => String(f[c] ?? '').toLowerCase().includes(q))
  );
  if(_sortCol){
    rows = [...rows].sort((a,b)=>{
      let va=a[_sortCol], vb=b[_sortCol];
      const na=Number(va), nb=Number(vb);
      if(!isNaN(na) && !isNaN(nb) && va!=='' && vb!==''){ va=na; vb=nb; }
      else { va=String(va??'').toLowerCase(); vb=String(vb??'').toLowerCase(); }
      if(va<vb) return -1*_sortDir;
      if(va>vb) return 1*_sortDir;
      return 0;
    });
  }
  return rows;
}

function ordenarPor(col){
  _sortDir = (_sortCol===col) ? _sortDir*-1 : 1;
  _sortCol = col;
  _pagina = 1;
  renderTabla();
}

function renderTabla(){
  const rows = filasFiltradas();
  const totalPaginas = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if(_pagina > totalPaginas) _pagina = totalPaginas;
  const inicio = (_pagina-1)*PAGE_SIZE;
  const pageRows = rows.slice(inicio, inicio+PAGE_SIZE);

  const thead = document.getElementById('thead-row');
  thead.innerHTML = _columnas.map(c => {
    const activo = _sortCol===c;
    const flecha = activo ? (_sortDir===1?' ▲':' ▼') : '';
    return `<th onclick="ordenarPor('${c.replace(/'/g,"\\'")}')">${c}${flecha}</th>`;
  }).join('');

  const tbody = document.getElementById('tbody');
  if(!pageRows.length){
    tbody.innerHTML = `<tr><td colspan="${_columnas.length||1}" class="empty">Sin resultados${document.getElementById('buscar').value?' para esa búsqueda':''}.</td></tr>`;
  }else{
    tbody.innerHTML = pageRows.map(f => `<tr>${_columnas.map(c=>{
      const v = f[c];
      const esNum = typeof v === 'number';
      return `<td${esNum?' class="num"':''}>${v==null?'—':(esNum?v.toLocaleString('es-AR'):v)}</td>`;
    }).join('')}</tr>`).join('');
  }

  document.getElementById('pager').innerHTML = rows.length ? `
    <button class="ghost" onclick="irPagina(${_pagina-1})" ${_pagina<=1?'disabled':''}>← Anterior</button>
    <span>Página ${_pagina} de ${totalPaginas} — ${rows.length.toLocaleString('es-AR')} registro(s)</span>
    <button class="ghost" onclick="irPagina(${_pagina+1})" ${_pagina>=totalPaginas?'disabled':''}>Siguiente →</button>
  ` : '';
}
function irPagina(p){ _pagina = p; renderTabla(); }

function descargarExcel(){
  if(!_filas.length){ alert('No hay datos para descargar.'); return; }
  const rows = filasFiltradas();
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Operaciones');
  const desde = document.getElementById('f-desde').value;
  const hasta = document.getElementById('f-hasta').value;
  XLSX.writeFile(wb, `operaciones_${desde}_${hasta}.xlsx`);
}
</script>
</body>
</html>
