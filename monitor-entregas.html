<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alleata · Entregas Pendientes</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#070c14;
    --panel:#0f1a2b;
    --panel2:#13223a;
    --border:#1e3252;
    --teal:#1dbf8e;
    --amber:#f5a623;
    --purple:#8b5cf6;
    --red:#ef4444;
    --text:#eef4fb;
    --text-dim:#7b93b3;
    --mono:'JetBrains Mono','Courier New',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 30px;border-bottom:2px solid var(--border);
    background:linear-gradient(180deg,#0d1626,#070c14);flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand-logo{font-size:22px;font-weight:800;letter-spacing:-1px;color:var(--teal)}
  .brand-title{font-size:14px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.6px}
  .header-right{display:flex;align-items:center;gap:24px}
  .clock{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .date{font-size:11px;color:var(--text-dim);text-transform:capitalize;margin-top:1px}
  .clock-wrap{text-align:right}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block;animation:pulse 2s infinite;margin-right:6px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .last-sync{font-size:10.5px;color:var(--text-dim);font-family:var(--mono)}

  .strip{display:flex;flex-shrink:0;border-bottom:2px solid var(--border)}
  .strip-item{flex:1;padding:8px 22px;border-right:1px solid var(--border);display:flex;align-items:baseline;gap:10px}
  .strip-item:last-child{border-right:none}
  .strip-num{font-family:var(--mono);font-size:24px;font-weight:800;line-height:1}
  .strip-lbl{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700}

  main{flex:1;overflow:hidden;padding:12px 30px;display:flex;gap:14px;min-height:0}
  .col{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
  .col-head{padding:9px 16px;border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .col-name{font-size:14px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
  .col-count{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(29,191,142,.15);color:var(--teal);border:1px solid rgba(29,191,142,.35);padding:1px 9px;border-radius:20px}
  .col-body{flex:1;overflow-y:auto;padding:7px;min-height:0}
  .col-body::-webkit-scrollbar{width:6px}
  .col-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  .stop{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:6px;position:relative}
  .stop-rollout{border-color:var(--purple);background:linear-gradient(135deg,rgba(139,92,246,.10),var(--panel2) 40%)}
  .stop-top{display:flex;flex-wrap:wrap;row-gap:5px;align-items:flex-start;gap:8px;margin-bottom:4px}
  .stop-left{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;row-gap:4px}
  .stop-orden{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text-dim);flex-shrink:0;width:18px;text-align:center}
  .stop-ot{font-family:var(--mono);font-size:16px;font-weight:800;letter-spacing:-.4px}
  .rollout-tag{font-size:9px;font-weight:800;color:var(--purple);background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.4);padding:1px 6px;border-radius:5px;letter-spacing:.4px;flex-shrink:0}
  .stop-horario{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--teal);background:rgba(29,191,142,.12);border:1px solid rgba(29,191,142,.3);padding:1px 7px;border-radius:6px;white-space:nowrap;flex-shrink:0}
  .stop-horario.fuera{color:var(--red);background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35)}
  .stop-llegada{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--text-dim);white-space:nowrap;flex-shrink:0}
  .col-regreso{font-size:10px;color:var(--text-dim);font-family:var(--mono);padding:4px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
  .stop-dir{font-size:12px;color:var(--text-dim);line-height:1.3;margin-left:26px}
  .stop-dist{font-size:9.5px;color:var(--text-dim);margin-top:2px;font-family:var(--mono);margin-left:26px}
  .sin-geo{opacity:.55}
  .sin-geo .stop-dist{color:var(--amber)}

  .empty-col{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;padding:26px;text-align:center}
  .empty-all{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-dim)}
  .empty-all .big{font-size:54px}
  .empty-all .msg{font-size:20px;font-weight:700;color:var(--text)}

  footer{flex-shrink:0;padding:6px 30px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);font-family:var(--mono)}

  .print-btn{background:linear-gradient(135deg,#17a07a,#1dbf8e);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  .print-btn:disabled{background:#1e3252;color:var(--text-dim);cursor:not-allowed}
  .print-btn:not(:disabled):hover{filter:brightness(1.08)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">alleata</div>
    <div class="brand-title">· Entregas pendientes — Logística Alleata</div>
  </div>
  <div class="header-right">
    <button id="btnRotulos" class="print-btn" onclick="imprimirRotulos()" disabled>🖨️ Imprimir rótulos</button>
    <div style="text-align:right">
      <div><span class="live-dot"></span><span class="last-sync" id="lastSync">cargando...</span></div>
      <div class="last-sync" id="nextSync" style="margin-top:2px;opacity:.75">—</div>
    </div>
    <div class="clock-wrap">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="dateLbl">—</div>
    </div>
  </div>
</header>

<div class="strip" id="strip"></div>

<main id="main"></main>

<footer>
  <span id="footLeft">Orden sugerido por zona (más cercano + horario de atención) · Rollout siempre primero</span>
  <span id="footRight">v2.3</span>
</footer>

<script>
const SUPABASE_URL='https://njkstpfmcfhqxdadqbdy.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qa3N0cGZtY2ZocXhkYWRxYmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNTkxMTksImV4cCI6MjA4ODczNTExOX0.7T0cZz1aGTWQZsjy7zeWsRWeG1SLw9y8cPK6RGVG8BA';

const ZONAS=[
  {key:'CABA',       label:'🏙️ CABA',       color:'#1a9fd4'},
  {key:'Zona Norte', label:'🔵 Z. Norte',    color:'#10b981'},

// Calcula cuándo va a correr la próxima recalculación en el servidor,
// siguiendo el MISMO cron que está en scheduler.js:
//   L-V 08-11h cada 2min | 12-16h cada 10min | 17-19h cada 1h
// Si esto se cambia en el backend, hay que actualizarlo acá también.
function proximaCorrida(desde){
  const d=new Date(desde);
  for(let intento=0; intento<8*24*60; intento++){ // tope de seguridad, nunca debería iterar tanto
    d.setSeconds(0,0);
    d.setMinutes(d.getMinutes()+1);
    const dia=d.getDay(), h=d.getHours(), m=d.getMinutes();
    const esHabil = dia>=1 && dia<=5;
    if(esHabil){
      if(h>=8&&h<12 && m%2===0) return d;
      if(h>=12&&h<17 && m%10===0) return d;
      if(h>=17&&h<20 && m===0) return d;
    }
  }
  return null;
}

function tickNextSync(){
  const prox=proximaCorrida(new Date());
  const el=document.getElementById('nextSync');
  if(!el)return;
  el.textContent = prox
    ? 'Próxima '+prox.toLocaleDateString('es-AR',{weekday:'short'})+' '+prox.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})
    : 'Próxima: sin datos';
}
setInterval(tickNextSync,1000);
tickNextSync();

function tickClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('dateLbl').textContent=now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(tickClock,1000);
tickClock();

function esc(v){return v?String(v).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])):'';}

let _cargando=false;
async function cargar(){
  if(_cargando)return; // por si una carga tarda más que el intervalo de refresco, no se pisan
  _cargando=true;
  try{
  const [{data,error}, {data:resumenZonas,error:errorResumen}] = await Promise.all([
    sb.from('ruta_sugerida_actual').select('*')
      .order('zona',{ascending:true}).order('orden_sugerido',{ascending:true}),
    sb.from('ruta_sugerida_resumen_zona').select('*'),
  ]);

  if(error){
    document.getElementById('lastSync').textContent='Error: '+error.message;
    return;
  }
  if(errorResumen){ console.warn('No se pudo leer ruta_sugerida_resumen_zona:', errorResumen.message); }

  const generadoAt = data?.[0]?.generado_at ? new Date(data[0].generado_at) : null;
  document.getElementById('lastSync').textContent = generadoAt
    ? 'Ruta calculada '+generadoAt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})
    : 'Sin datos todavía';

  _ultimaLista = data||[];
  document.getElementById('btnRotulos').disabled = !_ultimaLista.length;

  render(_ultimaLista, resumenZonas||[]);
  } finally {
    _cargando=false;
  }
}

// ── Impresión de rótulos ──────────────────────────────────────────────
// Pedido 02/09: un botón en el header que abre una hoja imprimible con un
// rótulo por cada entrega pendiente (mismo patrón que la "Hoja de Ruta"
// de distri.html, pero acá es 1 rótulo por página en vez de una tabla,
// pensado para pegar en el paquete/bolso de cada entrega). Usa los datos
// que YA están cargados en pantalla (_ultimaLista) — no vuelve a pegarle
// a Supabase.
let _ultimaLista = [];

function imprimirRotulos(){
  if(!_ultimaLista.length){ alert('No hay entregas pendientes cargadas todavía.'); return; }

  // Orden: zona → orden_sugerido, para que los rótulos salgan en el mismo
  // orden en que se ven en el monitor (y en el que se va a hacer la ruta).
  const items=[..._ultimaLista].sort((a,b)=>
    (a.zona||'').localeCompare(b.zona||'') || (a.orden_sugerido||0)-(b.orden_sugerido||0)
  );

  const ahora=new Date();
  const fechaLbl=ahora.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const horaLbl=ahora.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});

  const rotuloHtml=o=>`
    <div class="rotulo${o.es_rollout?' rollout':''}">
      <div class="rot-head">
        <div class="rot-brand">alleata</div>
        <div class="rot-zona">${esc(o.zona)||'—'}</div>
      </div>
      <div class="rot-ot">${esc(o.ot_numero)}</div>
      ${o.es_rollout?'<div class="rot-rollout">⚡ ROLLOUT — PRIORIDAD</div>':''}
      <div class="rot-cuenta">${esc(o.cuenta)||'—'}</div>
      <div class="rot-dir">${esc(o.direccion)||'—'}</div>
      <div class="rot-ciudad">${esc(o.ciudad)||''}${o.provincia?' · '+esc(o.provincia):''}</div>
      ${o.horario_entrega?`<div class="rot-horario">🕘 Horario de atención: ${esc(o.horario_entrega)}</div>`:''}
      <div class="rot-foot">Generado ${fechaLbl} · ${horaLbl} — orden sugerido #${o.orden_sugerido??'—'}</div>
    </div>`;

  const win=window.open('', '_blank');
  if(!win){ alert('El navegador bloqueó la ventana emergente — habilitá pop-ups para este sitio e intentá de nuevo.'); return; }

  win.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<title>Alleata · Rótulos de entrega</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,sans-serif;background:#f1f5f9;padding:20px}
  .toolbar{text-align:center;margin-bottom:18px}
  .toolbar button{background:linear-gradient(135deg,#00897B,#00BFA5);color:#fff;border:none;padding:11px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,191,165,.3)}
  .toolbar .count{color:#475569;font-size:12.5px;margin-top:8px}

  .rotulo{
    width:100mm;min-height:148mm;margin:0 auto 14px;background:#fff;border:2px solid #0A2540;
    border-radius:10px;padding:16px 18px;page-break-after:always;position:relative;
  }
  .rotulo.rollout{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.15) inset}
  .rot-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0A2540;padding-bottom:8px;margin-bottom:14px}
  .rot-brand{font-size:18px;font-weight:800;color:#00695C;letter-spacing:-.5px}
  .rot-zona{font-size:11px;font-weight:800;color:#0A2540;background:#e2e8f0;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
  .rot-ot{font-family:'Courier New',monospace;font-size:34px;font-weight:800;color:#0A2540;text-align:center;letter-spacing:1px;margin:10px 0}
  .rot-rollout{text-align:center;font-size:11px;font-weight:800;color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:6px;padding:4px;margin-bottom:12px;letter-spacing:.5px}
  .rot-cuenta{font-size:15px;font-weight:700;color:#0A2540;margin-bottom:6px}
  .rot-dir{font-size:14px;color:#1e293b;line-height:1.35}

  .rot-horario{font-size:12px;font-weight:700;color:#00695C;background:#e8f9f4;border:1px solid #a7f3d0;border-radius:6px;padding:6px 9px;display:inline-block;margin-top:4px}
  .rot-foot{position:absolute;bottom:10px;left:18px;right:18px;font-size:8.5px;color:#94a3b8;font-family:'Courier New',monospace;border-top:1px solid #e2e8f0;padding-top:6px}

</style></head><body>
<div class="toolbar no-print">
  <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  <div class="count">${items.length} rótulo${items.length===1?'':'s'} · uno por página (10×15cm aprox., ajustable en la configuración de impresión)</div>

${items.map(rotuloHtml).join('')}

  win.document.close();
}

function render(lista, resumenZonas){
  const strip=document.getElementById('strip');
  const main=document.getElementById('main');
  const resumenPorZona={};
  (resumenZonas||[]).forEach(r=>{ resumenPorZona[r.zona]=r; });

  const zonasKeys=ZONAS.map(z=>z.key);
  const enLas4=lista.filter(o=>zonasKeys.includes(o.zona));
  const fueraDeLas4=lista.filter(o=>!zonasKeys.includes(o.zona));
  const rollouts=enLas4.filter(o=>o.es_rollout).length;
  const sinGeo=enLas4.filter(o=>!o.geocodificado).length;
  const fueraDeHorario=enLas4.filter(o=>o.dentro_de_horario===false).length;

  strip.innerHTML=`
    <div class="strip-item">
      <div class="strip-num" style="color:var(--teal)">${enLas4.length}</div>
      <div class="strip-lbl">Pendientes<br>Pre-Colecta</div>
    </div>
    <div class="strip-item">
      <div class="strip-num" style="color:var(--purple)">${rollouts}</div>
      <div class="strip-lbl">Rollout<br>(prioridad)</div>
    </div>
    <div class="strip-item">
      <div class="strip-num" style="color:${sinGeo?'var(--amber)':'var(--text-dim)'}">${sinGeo}</div>
      <div class="strip-lbl">Sin ubicar<br>en el mapa</div>
    </div>
    ${fueraDeHorario?`<div class="strip-item">
      <div class="strip-num" style="color:var(--red)">${fueraDeHorario}</div>
      <div class="strip-lbl">Fuera de horario<br>de atención</div>
    </div>`:''}
    ${fueraDeLas4.length?`<div class="strip-item">
      <div class="strip-num" style="color:var(--red)">${fueraDeLas4.length}</div>
      <div class="strip-lbl">Fuera de estas 4<br>zonas — revisar</div>
    </div>`:''}
  `;

  const lista4=enLas4;

  if(!lista.length){
    main.innerHTML=`<div class="empty-all"><div class="big">✅</div><div class="msg">No hay entregas pendientes en Pre-Colecta</div></div>`;
    return;
  }

  const stopHtml=o=>{
    const sinGeoClass = o.geocodificado ? '' : ' sin-geo';
    const distTxt = o.distancia_prev_km!=null
      ? `~${o.distancia_prev_km} km desde la parada anterior`
      : (o.geocodificado ? 'primera parada de la ruta' : '📍 dirección no encontrada en el mapa — revisar manualmente');
    const horarioClass = o.dentro_de_horario===false ? ' fuera' : '';
    const horarioTag = o.horario_entrega
      ? `<div class="stop-horario${horarioClass}">${esc(o.horario_entrega)}${o.dentro_de_horario===false?' ⚠️':''}</div>` : '';
    const llegadaTag = o.hora_llegada_estimada
      ? `<div class="stop-llegada">🕘 llega ~${esc(o.hora_llegada_estimada)}</div>` : '';
    return `
    <div class="stop${o.es_rollout?' stop-rollout':''}${sinGeoClass}">
      <div class="stop-top">
        <div class="stop-left">
          <span class="stop-orden">${o.orden_sugerido}</span>
          <span class="stop-ot">${esc(o.ot_numero)}</span>
          ${o.es_rollout?'<span class="rollout-tag">ROLLOUT</span>':''}
        </div>
        ${llegadaTag}
        ${horarioTag}
      </div>
      <div class="stop-dir">${esc(o.direccion)||'—'}${o.ciudad?' · '+esc(o.ciudad):''}</div>
      <div class="stop-dist">${distTxt}</div>
    </div>`;
  };

  main.innerHTML=ZONAS.map(z=>{
    const items=lista.filter(o=>o.zona===z.key);
    const resumen=resumenPorZona[z.key];
    const regresoTxt = resumen?.hora_regreso_estimada
      ? `🔁 Vuelve a California ~${resumen.hora_regreso_estimada}${resumen.km_regreso!=null?' · '+resumen.km_regreso+' km último tramo':''}`
      : (items.length ? '🔁 Regreso: sin calcular todavía' : '');
    return `
      <div class="col">
        <div class="col-head" style="border-color:${z.color}55">
          <div class="col-name" style="color:${z.color}">${z.label}</div>
          <div class="col-count" style="color:${z.color};background:${z.color}22;border-color:${z.color}55">${items.length}</div>
        </div>
        ${regresoTxt?`<div class="col-regreso">${regresoTxt}</div>`:''}
        <div class="col-body">
          ${items.length ? items.map(stopHtml).join('') : '<div class="empty-col">Sin entregas pendientes<br>en esta zona</div>'}
        </div>
      </div>`;
  }).join('') + (fueraDeLas4.length ? `
      <div class="col">
        <div class="col-head" style="border-color:var(--red)55">
          <div class="col-name" style="color:var(--red)">⚠️ Fuera de zonas — revisar</div>
          <div class="col-count" style="color:var(--red);background:var(--red)22;border-color:var(--red)55">${fueraDeLas4.length}</div>
        </div>
        <div class="col-body">
          ${fueraDeLas4.map(o=>`
          <div class="stop${o.es_rollout?' stop-rollout':''}${o.geocodificado?'':' sin-geo'}">
            <div class="stop-top">
              <div class="stop-left">
                <span class="stop-ot">${esc(o.ot_numero)}</span>
                ${o.es_rollout?'<span class="rollout-tag">ROLLOUT</span>':''}
              </div>
              ${o.horario_entrega?`<div class="stop-horario">${esc(o.horario_entrega)}</div>`:''}
            </div>
            <div class="stop-dir">${esc(o.direccion)||'—'}${o.ciudad?' · '+esc(o.ciudad):''}${o.provincia?' ('+esc(o.provincia)+')':''}</div>
            <div class="stop-dist" style="color:var(--red)">zona calculada: "${esc(o.zona)||'—'}" — no coincide con ninguna de las 4 zonas AMBA, revisar ciudad/CP</div>
          </div>`).join('')}
        </div>
      </div>` : '');
}

cargar();
setInterval(cargar,REFRESH_MS);
</script>
</body>
</html>
