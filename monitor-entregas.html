<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alleata · Entregas Pendientes</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#070c14;
    --panel:#0f1a2b;
    --panel2:#13223a;
    --border:#1e3252;
    --teal:#1dbf8e;
    --amber:#f5a623;
    --red:#ef4444;
    --text:#eef4fb;
    --text-dim:#7b93b3;
    --mono:'JetBrains Mono','Courier New',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column}

  /* ── header ── */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 40px;border-bottom:2px solid var(--border);
    background:linear-gradient(180deg,#0d1626,#070c14);
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:16px}
  .brand-logo{font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--teal)}
  .brand-title{font-size:18px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px}
  .header-right{display:flex;align-items:center;gap:34px}
  .clock{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .date{font-size:13px;color:var(--text-dim);text-transform:capitalize;margin-top:2px}
  .clock-wrap{text-align:right}
  .live-dot{width:10px;height:10px;border-radius:50%;background:var(--teal);display:inline-block;animation:pulse 2s infinite;margin-right:8px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .last-sync{font-size:12px;color:var(--text-dim);font-family:var(--mono)}

  /* ── summary strip ── */
  .strip{
    display:flex;gap:0;flex-shrink:0;border-bottom:2px solid var(--border);
  }
  .strip-item{
    flex:1;padding:16px 30px;border-right:1px solid var(--border);
    display:flex;align-items:baseline;gap:14px;
  }
  .strip-item:last-child{border-right:none}
  .strip-num{font-family:var(--mono);font-size:40px;font-weight:800;line-height:1}
  .strip-lbl{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}

  /* ── body: columnas por chofer ── */
  main{flex:1;overflow:hidden;padding:24px 40px;display:flex;gap:20px}
  .gate{
    flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .gate-sinasignar{border-color:var(--amber)}
  .gate-head{
    padding:16px 22px;border-bottom:2px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .gate-sinasignar .gate-head{border-color:var(--amber);background:rgba(245,166,35,.08)}
  .gate-name{font-size:19px;font-weight:800;letter-spacing:.3px}
  .gate-sinasignar .gate-name{color:var(--amber)}
  .gate-count{
    font-family:var(--mono);font-size:15px;font-weight:700;
    background:rgba(29,191,142,.15);color:var(--teal);border:1px solid rgba(29,191,142,.35);
    padding:3px 12px;border-radius:20px;
  }
  .gate-sinasignar .gate-count{background:rgba(245,166,35,.15);color:var(--amber);border-color:rgba(245,166,35,.4)}
  .gate-body{flex:1;overflow-y:auto;padding:10px}
  .gate-body::-webkit-scrollbar{width:8px}
  .gate-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  .card{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
  .card-ot{font-family:var(--mono);font-size:20px;font-weight:800;letter-spacing:-.5px}
  .card-tipo{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .card-horario{
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--teal);
    background:rgba(29,191,142,.12);border:1px solid rgba(29,191,142,.3);
    padding:3px 9px;border-radius:6px;white-space:nowrap;flex-shrink:0;
  }
  .card-cliente{font-size:15px;font-weight:700;margin-bottom:3px}
  .card-dir{font-size:13px;color:var(--text-dim);line-height:1.4}

  .empty-gate{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;padding:30px}
  .empty-all{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-dim)}
  .empty-all .big{font-size:60px}
  .empty-all .msg{font-size:22px;font-weight:700;color:var(--text)}

  footer{
    flex-shrink:0;padding:10px 40px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);font-family:var(--mono);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">alleata</div>
    <div class="brand-title">· Entregas pendientes — Logística Alleata</div>
  </div>
  <div class="header-right">
    <div><span class="live-dot"></span><span class="last-sync" id="lastSync">cargando...</span></div>
    <div class="clock-wrap">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="dateLbl">—</div>
    </div>
  </div>
</header>

<div class="strip" id="strip"></div>

<main id="main"></main>

<footer>
  <span>Actualiza automáticamente cada 30s</span>
  <span id="footRight">v1.0</span>
</footer>

<script>
const SUPABASE_URL='https://njkstpfmcfhqxdadqbdy.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qa3N0cGZtY2ZocXhkYWRxYmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNTkxMTksImV4cCI6MjA4ODczNTExOX0.7T0cZz1aGTWQZsjy7zeWsRWeG1SLw9y8cPK6RGVG8BA';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

const REFRESH_MS=30000; // 30s — suficientemente rápido para una pantalla en vivo, sin saturar Supabase

function tickClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('dateLbl').textContent=now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(tickClock,1000);
tickClock();

function esc(v){return v?String(v).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])):'';}

async function cargar(){
  const{data,error}=await sb.from('sf_workorders')
    .select('workorder_number,cuenta,direccion,ciudad,provincia,responsable,horario_entrega,horario,record_type')
    .eq('logistica','ALLEATA')
    .eq('status','Pre-Colecta')
    .order('responsable',{ascending:true,nullsFirst:false});

  document.getElementById('lastSync').textContent = error
    ? 'Error: '+error.message
    : 'Actualizado '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

  const lista=data||[];
  render(lista);
}

function render(lista){
  const strip=document.getElementById('strip');
  const main=document.getElementById('main');

  const sinAsignar=lista.filter(o=>!o.responsable);
  const porChofer={};
  lista.filter(o=>o.responsable).forEach(o=>{
    (porChofer[o.responsable]=porChofer[o.responsable]||[]).push(o);
  });
  const choferes=Object.keys(porChofer).sort((a,b)=>porChofer[b].length-porChofer[a].length);

  // ── strip resumen ──
  strip.innerHTML=`
    <div class="strip-item">
      <div class="strip-num" style="color:var(--teal)">${lista.length}</div>
      <div class="strip-lbl">Pendientes<br>Pre-Colecta</div>
    </div>
    <div class="strip-item">
      <div class="strip-num" style="color:${sinAsignar.length?'var(--amber)':'var(--text-dim)'}">${sinAsignar.length}</div>
      <div class="strip-lbl">Sin asignar</div>
    </div>
    <div class="strip-item">
      <div class="strip-num" style="color:#8b5cf6">${choferes.length}</div>
      <div class="strip-lbl">Choferes<br>con entregas</div>
    </div>
  `;

  if(!lista.length){
    main.innerHTML=`<div class="empty-all"><div class="big">✅</div><div class="msg">No hay entregas pendientes en Pre-Colecta</div></div>`;
    return;
  }

  const cardHtml=o=>`
    <div class="card">
      <div class="card-top">
        <div>
          <div class="card-ot">${esc(o.workorder_number)}</div>
          <div class="card-tipo">${esc(o.record_type)}</div>
        </div>
        ${(o.horario_entrega||o.horario)?`<div class="card-horario">${esc(o.horario_entrega||o.horario)}</div>`:''}
      </div>
      <div class="card-cliente">${esc(o.cuenta)||'—'}</div>
      <div class="card-dir">${esc(o.direccion)||'—'}${o.ciudad?' · '+esc(o.ciudad):''}${o.provincia?' · '+esc(o.provincia):''}</div>
    </div>`;

  const gates=[];

  if(sinAsignar.length){
    gates.push(`
      <div class="gate gate-sinasignar">
        <div class="gate-head"><div class="gate-name">⚠️ Sin asignar</div><div class="gate-count">${sinAsignar.length}</div></div>
        <div class="gate-body">${sinAsignar.map(cardHtml).join('')}</div>
      </div>`);
  }

  choferes.forEach(nombre=>{
    const items=porChofer[nombre];
    gates.push(`
      <div class="gate">
        <div class="gate-head"><div class="gate-name">🚚 ${esc(nombre)}</div><div class="gate-count">${items.length}</div></div>
        <div class="gate-body">${items.map(cardHtml).join('')}</div>
      </div>`);
  });

  main.innerHTML=gates.join('');
}

cargar();
setInterval(cargar,REFRESH_MS);
</script>
</body>
</html>
